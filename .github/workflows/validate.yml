name: Validate and release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate skill against the Agent Skills spec
        run: |
          pip install "git+https://github.com/agentskills/agentskills#subdirectory=skills-ref"
          skills-ref validate skills/sciwrite

  release:
    needs: validate
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The zip holds the skill folder at its root, which is what
      # claude.ai, ChatGPT, and other upload-based clients expect.
      - name: Build skill zip
        run: |
          cd skills
          zip -r "../sciwrite-${GITHUB_REF_NAME}.zip" sciwrite -x 'sciwrite/evals/*'

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "sciwrite-${GITHUB_REF_NAME}.zip" \
            --title "SciWrite $GITHUB_REF_NAME" --notes-file CHANGELOG.md
